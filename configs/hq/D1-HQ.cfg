! D1-HQ - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname D1-HQ
!
enable secret <REDACTED>
username abdo secret <REDACTED>
username ali secret <REDACTED>
username malak secret <REDACTED>
no aaa new-model
no ip domain-lookup
logging buffered 50000
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 1,10,20,999 priority 24576
spanning-tree vlan 30,40 priority 28672
!
track 1 interface Ethernet0/0 line-protocol
!
ip dhcp excluded-address 192.168.10.1
ip dhcp excluded-address 192.168.10.2
ip dhcp excluded-address 192.168.10.100
ip dhcp excluded-address 192.168.20.1
ip dhcp excluded-address 192.168.20.2
ip dhcp excluded-address 192.168.20.100
ip dhcp excluded-address 192.168.30.1
ip dhcp excluded-address 192.168.30.2
ip dhcp excluded-address 192.168.30.100
ip dhcp excluded-address 192.168.40.1
ip dhcp excluded-address 192.168.40.2
ip dhcp excluded-address 192.168.40.100
!
ip dhcp pool vlan10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name HQ_VLAN10
!
ip dhcp pool vlan20
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name HQ_VLAN20
!
ip dhcp pool vlan30
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name HQ_VLAN30
!
ip dhcp pool vlan40
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name HQ_VLAN40
!
interface Ethernet0/0
 description to HQ router (via IOU switch)
 no switchport
 ip address 192.168.50.2 255.255.255.0
 ip access-group deny_out out
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
 ip ospf network broadcast
 ip ospf priority 100
 ip ospf 1 area 0
 duplex full
!
interface Ethernet0/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet0/3
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet1/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
!
interface Ethernet1/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
!
interface Ethernet1/3
 shutdown
!
interface Vlan10
 ip address 192.168.10.1 255.255.255.0
 ip access-group deny_in in
 standby 10 ip 192.168.10.100
 standby 10 priority 150
 standby 10 preempt
 standby 10 track 1 decrement 60
!
interface Vlan20
 ip address 192.168.20.1 255.255.255.0
 ip access-group deny_in in
 standby 20 ip 192.168.20.100
 standby 20 priority 150
 standby 20 preempt
 standby 20 track 1 decrement 60
!
interface Vlan30
 ip address 192.168.30.1 255.255.255.0
 ip access-group deny_in in
 standby 30 ip 192.168.30.100
 standby 30 preempt
 ip ospf cost 10
!
interface Vlan40
 ip address 192.168.40.1 255.255.255.0
 ip access-group deny_in in
 standby 40 ip 192.168.40.100
 standby 40 preempt
 ip ospf cost 10
!
router ospf 1
 router-id 11.11.11.11
 passive-interface default
 no passive-interface Ethernet0/0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
!
no ip http server
no ip http secure-server
!
ip access-list extended deny_in
 deny   ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny   ip 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny   ip 192.168.30.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny   ip 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny   ip 192.168.40.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny   ip 192.168.40.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny   icmp 192.168.40.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   icmp 192.168.30.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   icmp 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 permit ip any any
ip access-list extended deny_out
 deny   ip 192.168.20.0 0.0.0.255 192.168.60.0 0.0.0.255
 deny   ip 192.168.30.0 0.0.0.255 192.168.60.0 0.0.0.255
 deny   ip 192.168.40.0 0.0.0.255 192.168.60.0 0.0.0.255
 deny   ip 192.168.20.0 0.0.0.255 192.168.31.0 0.0.0.255
 deny   ip 192.168.20.0 0.0.0.255 192.168.41.0 0.0.0.255
 deny   ip 192.168.30.0 0.0.0.255 192.168.41.0 0.0.0.255
 deny   ip 192.168.30.0 0.0.0.255 192.168.21.0 0.0.0.255
 deny   ip 192.168.40.0 0.0.0.255 192.168.21.0 0.0.0.255
 deny   ip 192.168.40.0 0.0.0.255 192.168.31.0 0.0.0.255
 deny   icmp 192.168.40.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 deny   icmp 192.168.20.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 deny   icmp 192.168.30.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 permit ip any any

line con 0
 exec-timeout 0 0
 privilege level 15
 password <REDACTED>
 logging synchronous
 login
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
!
ntp master 3
!
end
