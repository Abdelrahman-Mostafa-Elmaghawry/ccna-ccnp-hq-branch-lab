! HQ router - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname HQ
!
enable secret <REDACTED>
username abdo secret <REDACTED>
username ali secret <REDACTED>
username malak secret <REDACTED>
no aaa new-model
no ip domain lookup
ip domain name HQ
ip ssh version 2
!
track 1 ip sla 1 reachability
!
crypto isakmp policy 1
 encr aes 256
 hash sha512
 authentication pre-share
 group 14
 lifetime 3600
crypto isakmp key <REDACTED> address 2.0.0.2
crypto isakmp keepalive 10 3
!
crypto ipsec transform-set Tunnel_ipsec esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto map GRE_IPSEC local-address Loopback1
crypto map GRE_IPSEC 1 ipsec-isakmp
 set peer 2.0.0.2
 set transform-set Tunnel_ipsec
 match address 100
!
interface Loopback1
 ip address 1.0.0.1 255.255.255.255
!
interface Tunnel1
 ip address 12.0.0.1 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
 ip ospf 2 area 0
 tunnel source 1.0.0.1
 tunnel destination 2.0.0.2
!
interface FastEthernet0/0
 description to HQ LAN (192.168.50.0/24)
 ip address 192.168.50.1 255.255.255.0
 ip nat inside
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
 ip ospf priority 255
 duplex full
!
interface Serial2/1
 description to ISP-1 (backup link)
 ip address 11.1.0.2 255.255.255.252
 ip nat outside
 crypto map GRE_IPSEC
!
interface Serial2/2
 description to ISP-1 (primary link)
 ip address 11.0.0.2 255.255.255.252
 ip nat outside
 crypto map GRE_IPSEC
!
router ospf 2
 redistribute ospf 1 subnets
!
router ospf 1
 router-id 1.1.1.1
 redistribute static subnets
 passive-interface default
 no passive-interface FastEthernet0/0
 network 192.168.50.0 0.0.0.7 area 0
 default-information originate
!
no ip http server
no ip http secure-server
!
ip nat inside source route-map NAT-ISP1 interface Serial2/2 overload
ip nat inside source route-map NAT-ISP2 interface Serial2/1 overload
ip route 0.0.0.0 0.0.0.0 11.0.0.1 track 1
ip route 0.0.0.0 0.0.0.0 11.1.0.1 5
!
ip sla 1
 icmp-echo 11.0.0.1
ip sla schedule 1 life forever start-time now
!
access-list 1 permit 192.168.10.0 0.0.0.255
access-list 1 permit 192.168.20.0 0.0.0.255
access-list 1 permit 192.168.30.0 0.0.0.255
access-list 1 permit 192.168.40.0 0.0.0.255
access-list 100 permit gre host 1.0.0.1 host 2.0.0.2
!
route-map NAT-ISP1 permit 10
 match ip address 1
 match interface Serial2/2
!
route-map NAT-ISP2 permit 10
 match ip address 1
 match interface Serial2/1
!
line con 0
 exec-timeout 0 0
 privilege level 15
 password <REDACTED>
 logging synchronous
 login
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 logging synchronous
 login local
 transport input ssh
!
ntp server 192.168.50.2
!
end
