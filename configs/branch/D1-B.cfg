! D1-B - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname D1-B
!
enable secret <REDACTED>
username abdo secret <REDACTED>
username ali secret <REDACTED>
username malak secret <REDACTED>
no aaa new-model
no ip domain-lookup
logging buffered 50000
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 1,10,20,999 priority 24576
spanning-tree vlan 30,40 priority 28672
!
track 1 interface Ethernet0/0 line-protocol
!
ip dhcp excluded-address 192.168.11.1
ip dhcp excluded-address 192.168.11.2
ip dhcp excluded-address 192.168.11.100
ip dhcp excluded-address 192.168.21.1
ip dhcp excluded-address 192.168.21.2
ip dhcp excluded-address 192.168.21.100
ip dhcp excluded-address 192.168.31.1
ip dhcp excluded-address 192.168.31.2
ip dhcp excluded-address 192.168.31.100
ip dhcp excluded-address 192.168.41.1
ip dhcp excluded-address 192.168.41.2
ip dhcp excluded-address 192.168.41.100
!
ip dhcp pool vlan10
 network 192.168.11.0 255.255.255.0
 default-router 192.168.11.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name B_VLAN10
!
ip dhcp pool vlan20
 network 192.168.21.0 255.255.255.0
 default-router 192.168.21.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name B_VLAN20
!
ip dhcp pool vlan30
 network 192.168.31.0 255.255.255.0
 default-router 192.168.31.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name B_VLAN30
!
ip dhcp pool vlan40
 network 192.168.41.0 255.255.255.0
 default-router 192.168.41.100
 dns-server 8.8.8.8 1.1.1.1 4.2.2.2
 domain-name B_VLAN40
!
interface Ethernet0/0
 description to Branch router (via IOU switch)
 no switchport
 ip address 192.168.60.2 255.255.255.0
 ip access-group deny_out out
 ip authentication mode eigrp 1 md5
 ip authentication key-chain eigrp 1 EIGRP_KEY
 duplex half
!
interface Ethernet0/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet0/3
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet1/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
!
interface Ethernet1/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
!
interface Ethernet1/3
 shutdown
!
interface Vlan10
 ip address 192.168.11.1 255.255.255.0
 ip access-group deny_in in
 vrrp 10 ip 192.168.11.100
 vrrp 10 priority 150
 vrrp 10 track 1 decrement 60
!
interface Vlan20
 ip address 192.168.21.1 255.255.255.0
 ip access-group deny_in in
 vrrp 20 ip 192.168.21.100
 vrrp 20 priority 150
 vrrp 20 track 1 decrement 60
!
interface Vlan30
 ip address 192.168.31.1 255.255.255.0
 ip access-group deny_in in
 vrrp 30 ip 192.168.31.100
!
interface Vlan40
 ip address 192.168.41.1 255.255.255.0
 ip access-group deny_in in
 vrrp 40 ip 192.168.41.100
!
key chain EIGRP_KEY
 key 1
  key-string <REDACTED>
  accept-lifetime 00:00:00 Oct 1 2026 00:00:00 Jan 1 2027
  send-lifetime 00:00:00 Oct 1 2026 00:00:00 Jan 1 2027
 key 2
  key-string <REDACTED>
  accept-lifetime 00:00:00 Jan 1 2027 infinite
  send-lifetime 00:00:00 Jan 1 2027 infinite
!
router eigrp 1
 network 192.168.11.0
 network 192.168.21.0
 network 192.168.31.0
 network 192.168.41.0
 network 192.168.60.0
 offset-list feas_successors out 1000 Ethernet0/0
 passive-interface default
 no passive-interface Ethernet0/0
 eigrp router-id 11.11.11.11
!
no ip http server
no ip http secure-server
!
ip access-list standard feas_successors
 permit 192.168.31.0 0.0.0.255
 permit 192.168.41.0 0.0.0.255
!
ip access-list extended deny_in
 deny   ip 192.168.31.0 0.0.0.255 192.168.21.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.41.0 0.0.0.255
 deny   ip 192.168.21.0 0.0.0.255 192.168.31.0 0.0.0.255
 deny   ip 192.168.21.0 0.0.0.255 192.168.41.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.31.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.21.0 0.0.0.255
 deny   icmp 192.168.21.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 deny   icmp 192.168.31.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 deny   icmp 192.168.41.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 permit ip any any
ip access-list extended deny_out
 deny   ip 192.168.21.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny   ip 192.168.21.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny   icmp 192.168.41.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   icmp 192.168.31.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   icmp 192.168.21.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   ip 192.168.21.0 0.0.0.255 192.168.50.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.50.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.50.0 0.0.0.255
 permit ip any any

line con 0
 exec-timeout 0 0
 privilege level 15
 password <REDACTED>
 logging synchronous
 login
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
!
ntp master 3
!
end
