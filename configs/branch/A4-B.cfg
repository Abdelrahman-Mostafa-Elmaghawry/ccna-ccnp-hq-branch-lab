! A4-B - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname A4-B
!
enable secret <REDACTED>
username abdo secret <REDACTED>
username ali secret <REDACTED>
username malak secret <REDACTED>
no aaa new-model
no ip domain-lookup
logging buffered 50000
!
ip arp inspection vlan 10,20,30,40
ip arp inspection validate src-mac dst-mac ip
ip dhcp snooping vlan 10,20,30,40
no ip dhcp snooping information option
ip dhcp snooping
!
errdisable recovery cause all
errdisable recovery interval 30
!
spanning-tree mode rapid-pvst
spanning-tree portfast edge bpduguard default
spanning-tree extend system-id
!
interface Ethernet0/0
 description UPLINK to distribution
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 ip arp inspection trust
 ip dhcp snooping trust
!
interface Ethernet0/1
 description END-USER (VLAN 40)
 switchport access vlan 40
 switchport mode access
 switchport nonegotiate
 switchport port-security mac-address sticky
 switchport port-security
 spanning-tree portfast edge
 ip dhcp snooping limit rate 3
!
interface Ethernet0/2
 description UPLINK to distribution
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 ip arp inspection trust
 ip dhcp snooping trust
!
interface Ethernet0/3
 switchport mode access
 switchport nonegotiate
 switchport port-security mac-address sticky
 switchport port-security
 spanning-tree portfast edge
 ip dhcp snooping limit rate 3
!
interface Ethernet1/0
 switchport mode access
 switchport nonegotiate
 switchport port-security mac-address sticky
 switchport port-security
 spanning-tree portfast edge
 ip dhcp snooping limit rate 3
!
interface Ethernet1/1
 switchport mode access
 switchport nonegotiate
 switchport port-security mac-address sticky
 switchport port-security
 spanning-tree portfast edge
 ip dhcp snooping limit rate 3
!
interface Ethernet1/2
 switchport mode access
 switchport nonegotiate
 switchport port-security mac-address sticky
 switchport port-security
 spanning-tree portfast edge
 ip dhcp snooping limit rate 3
!
interface Ethernet1/3
 switchport mode access
 switchport nonegotiate
 switchport port-security mac-address sticky
 switchport port-security
 spanning-tree portfast edge
 ip dhcp snooping limit rate 3
!
interface Vlan1
 no ip address
 shutdown
!
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 password <REDACTED>
 logging synchronous
 login
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
!
end
