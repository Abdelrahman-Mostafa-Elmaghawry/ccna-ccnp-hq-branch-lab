! Branch router - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname Branch
!
enable secret <REDACTED>
username abdo secret <REDACTED>
username ali secret <REDACTED>
username malak secret <REDACTED>
no aaa new-model
no ip domain lookup
ip domain name Branch
ip ssh version 2
!
key chain EIGRP_KEY
 key 1
  key-string <REDACTED>
  accept-lifetime 00:00:00 Oct 1 2026 00:00:00 Jan 1 2027
  send-lifetime 00:00:00 Oct 1 2026 00:00:00 Jan 1 2027
 key 2
  key-string <REDACTED>
  accept-lifetime 00:00:00 Jan 1 2027 infinite
  send-lifetime 00:00:00 Jan 1 2027 infinite
!
crypto isakmp policy 1
 encr aes 256
 hash sha512
 authentication pre-share
 group 14
 lifetime 3600
crypto isakmp key <REDACTED> address 1.0.0.1
crypto isakmp keepalive 10 3
!
crypto ipsec transform-set Tunnel_ipsec esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto map GRE_IPSEC local-address Loopback1
crypto map GRE_IPSEC 10 ipsec-isakmp
 set peer 1.0.0.1
 set transform-set Tunnel_ipsec
 match address 100
!
interface Loopback1
 ip address 2.0.0.2 255.255.255.255
!
interface Tunnel1
 ip address 12.0.0.2 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
 ip ospf 2 area 0
 tunnel source 2.0.0.2
 tunnel destination 1.0.0.1
!
interface FastEthernet0/0
 description to Branch LAN (192.168.60.0/24)
 ip address 192.168.60.1 255.255.255.0
 ip authentication mode eigrp 1 md5
 ip authentication key-chain eigrp 1 EIGRP_KEY
 ip nat inside
 duplex half
!
interface Serial2/1
 description to ISP-2
 ip address 11.3.0.2 255.255.255.252
 ip nat outside
 crypto map GRE_IPSEC
!
router eigrp 1
 network 192.168.60.0
 redistribute static
 passive-interface default
 no passive-interface FastEthernet0/0
 eigrp router-id 2.2.2.2
!
router ospf 2
 redistribute eigrp 1 subnets
!
no ip http server
no ip http secure-server
!
ip nat inside source list 1 interface Serial2/1 overload
ip route 0.0.0.0 0.0.0.0 11.3.0.1
!
access-list 1 permit 192.168.11.0 0.0.0.255
access-list 1 permit 192.168.21.0 0.0.0.255
access-list 1 permit 192.168.31.0 0.0.0.255
access-list 1 permit 192.168.41.0 0.0.0.255
access-list 100 permit gre host 2.0.0.2 host 1.0.0.1
!
line con 0
 exec-timeout 0 0
 privilege level 15
 password <REDACTED>
 logging synchronous
 login
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
ntp server 192.168.60.2
!
end
