! D2-B - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname D2-B
!
enable secret <REDACTED>
username abdo secret <REDACTED>
username ali secret <REDACTED>
username malak secret <REDACTED>
no aaa new-model
no ip domain-lookup
logging buffered 50000
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 1,10,20,999 priority 28672
spanning-tree vlan 30,40 priority 24576
!
track 1 interface Ethernet0/0 line-protocol
!
interface Ethernet0/0
 description to Branch router (via IOU switch)
 no switchport
 ip address 192.168.60.3 255.255.255.0
 ip access-group deny_out out
 ip authentication mode eigrp 1 md5
 ip authentication key-chain eigrp 1 EIGRP_KEY
 duplex half
!
interface Ethernet0/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet0/3
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet1/0
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 spanning-tree guard root
!
interface Ethernet1/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
!
interface Ethernet1/2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
!
interface Ethernet1/3
 shutdown
!
interface Vlan10
 ip address 192.168.11.2 255.255.255.0
 ip access-group deny_in in
 vrrp 10 ip 192.168.11.100
!
interface Vlan20
 ip address 192.168.21.2 255.255.255.0
 ip access-group deny_in in
 vrrp 20 ip 192.168.21.100
!
interface Vlan30
 ip address 192.168.31.2 255.255.255.0
 ip access-group deny_in in
 vrrp 30 ip 192.168.31.100
 vrrp 30 priority 150
 vrrp 30 track 1 decrement 60
!
interface Vlan40
 ip address 192.168.41.2 255.255.255.0
 ip access-group deny_in in
 vrrp 40 ip 192.168.41.100
 vrrp 40 priority 150
 vrrp 40 track 1 decrement 60
!
key chain EIGRP_KEY
 key 1
  key-string <REDACTED>
  accept-lifetime 00:00:00 Oct 1 2026 00:00:00 Jan 1 2027
  send-lifetime 00:00:00 Oct 1 2026 00:00:00 Jan 1 2027
 key 2
  key-string <REDACTED>
  accept-lifetime 00:00:00 Jan 1 2027 infinite
  send-lifetime 00:00:00 Jan 1 2027 infinite
!
router eigrp 1
 network 192.168.11.0
 network 192.168.21.0
 network 192.168.31.0
 network 192.168.41.0
 network 192.168.60.0
 offset-list feas_successor out 1000 Ethernet0/0
 passive-interface default
 no passive-interface Ethernet0/0
 eigrp router-id 22.22.22.22
!
no ip http server
no ip http secure-server
!
ip access-list standard feas_successor
 permit 192.168.11.0 0.0.0.255
 permit 192.168.21.0 0.0.0.255
!
ip access-list extended deny_in
 deny   ip 192.168.31.0 0.0.0.255 192.168.21.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.41.0 0.0.0.255
 deny   ip 192.168.21.0 0.0.0.255 192.168.31.0 0.0.0.255
 deny   ip 192.168.21.0 0.0.0.255 192.168.41.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.31.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.21.0 0.0.0.255
 deny   icmp 192.168.21.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 deny   icmp 192.168.31.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 deny   icmp 192.168.41.0 0.0.0.255 192.168.11.0 0.0.0.255 echo
 permit ip any any
ip access-list extended deny_out
 deny   ip 192.168.21.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny   ip 192.168.21.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.40.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny   icmp 192.168.41.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   icmp 192.168.31.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   icmp 192.168.21.0 0.0.0.255 192.168.10.0 0.0.0.255 echo
 deny   ip 192.168.21.0 0.0.0.255 192.168.50.0 0.0.0.255
 deny   ip 192.168.31.0 0.0.0.255 192.168.50.0 0.0.0.255
 deny   ip 192.168.41.0 0.0.0.255 192.168.50.0 0.0.0.255
 permit ip any any

line con 0
 exec-timeout 0 0
 privilege level 15
 password <REDACTED>
 logging synchronous
 login
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
!
ntp server 192.168.60.2
!
end
