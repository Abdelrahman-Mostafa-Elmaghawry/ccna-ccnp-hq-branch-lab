! ISP-1 - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname ISP-1
!
track 1 ip sla 1 reachability
!
interface Serial2/0
 description to ISP-2
 ip address 11.2.0.2 255.255.255.252
!
interface Serial2/1
 description to HQ (backup link)
 ip address 11.1.0.1 255.255.255.252
!
interface Serial2/2
 description to HQ (primary link)
 ip address 11.0.0.1 255.255.255.252
!
router ospf 2
 router-id 1.0.0.0
 redistribute static subnets
 passive-interface default
 no passive-interface Serial2/0
 network 11.0.0.0 0.0.0.3 area 0
 network 11.1.0.0 0.0.0.3 area 0
 network 11.2.0.0 0.0.0.3 area 0
!
ip route 1.0.0.1 255.255.255.255 11.0.0.2 track 1
ip route 1.0.0.1 255.255.255.255 11.1.0.2 5
!
ip sla 1
 icmp-echo 11.0.0.2
ip sla schedule 1 life forever start-time now
!
line vty 0 4
 login
 transport input all
!
end
