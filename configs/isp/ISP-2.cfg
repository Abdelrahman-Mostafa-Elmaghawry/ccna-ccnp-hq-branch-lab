! ISP-2 - SANITIZED config
! Secrets are replaced with <REDACTED>. Unused Serial/FastEthernet interfaces
! (shutdown, no IP) are omitted for readability.
!
hostname ISP-2
!
interface Serial2/0
 description to ISP-1
 ip address 11.2.0.1 255.255.255.252
!
interface Serial2/1
 description to Branch
 ip address 11.3.0.1 255.255.255.252
!
router ospf 2
 router-id 2.0.0.0
 redistribute static subnets
 passive-interface default
 no passive-interface Serial2/0
 network 11.2.0.0 0.0.0.3 area 0
 network 11.3.0.0 0.0.0.3 area 0
!
ip route 2.0.0.2 255.255.255.255 11.3.0.2
!
line vty 0 4
 login
 transport input all
!
end
